<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tony Webb — Statistics Review Editor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, sans-serif; font-size: 13px; background: #f0f0f0; color: #1a1a1a; }

  /* ── toolbar ── */
  #toolbar {
    position: sticky; top: 0; z-index: 100;
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: #1e3a5f; color: #fff;
  }
  #toolbar h1 { margin: 0; font-size: 14px; font-weight: 600; flex: 1; }
  #toolbar button, #toolbar label {
    padding: 5px 12px; border-radius: 4px; border: none; cursor: pointer; font-size: 12px;
  }
  #btnLoad { background: #4a90d9; color: #fff; }
  #btnSave { background: #2ecc71; color: #fff; }
  #btnSave:disabled { background: #999; cursor: default; }
  #statusMsg { font-size: 11px; opacity: .8; }

  /* ── layout ── */
  #layout {
    display: grid; grid-template-columns: 2fr 3fr;
    height: calc(100vh - 40px); overflow: hidden;
  }

  /* ── image pane ── */
  #imagePane {
    background: #111; display: flex; flex-direction: column;
    overflow: hidden; border-right: 2px solid #333;
  }
  #imageControls {
    display: flex; align-items: center; gap: 8px; padding: 6px 10px;
    background: #222; color: #ccc; font-size: 12px; flex-shrink: 0;
  }
  #imageControls input[type=number] {
    width: 60px; padding: 3px 6px; border-radius: 3px;
    border: 1px solid #555; background: #333; color: #fff;
  }
  #imageControls button {
    padding: 3px 8px; background: #4a90d9; color: #fff;
    border: none; border-radius: 3px; cursor: pointer; font-size: 11px;
  }
  #imgWrapper { flex: 1; overflow: auto; }
  #pageImg { display: block; width: 300%; height: auto; }
  #imgPlaceholder {
    display: flex; align-items: center; justify-content: center;
    height: 100%; color: #555; font-size: 14px;
  }

  /* ── editor pane ── */
  #editorPane { overflow-y: auto; padding: 14px; background: #fafafa; }

  /* ── sections ── */
  .section { background: #fff; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 14px; overflow: hidden; }
  .section-header {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; background: #f5f7fa; border-bottom: 1px solid #ddd; cursor: pointer;
  }
  .section-header h2 { margin: 0; font-size: 13px; font-weight: 600; flex: 1; }
  .section-header .badge {
    font-size: 10px; background: #1e3a5f; color: #fff;
    padding: 2px 7px; border-radius: 10px;
  }
  .section-body { padding: 12px; }
  .collapsed .section-body { display: none; }

  /* ── field grid ── */
  .field-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .field { display: flex; flex-direction: column; gap: 2px; }
  .field label { font-size: 10px; font-weight: 600; color: #666; text-transform: uppercase; letter-spacing: .4px; }
  .field input, .field select {
    padding: 4px 7px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; background: #fff;
  }
  .field input:focus { outline: 2px solid #4a90d9; border-color: transparent; }
  .field input.changed { border-color: #e67e22; background: #fffaf5; }

  /* ── player table ── */
  .player-table-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 680px; table-layout: fixed; font-size: 11px; }
  thead tr { background: #1e3a5f; color: #fff; }
  th { padding: 5px 7px; text-align: left; white-space: nowrap; font-weight: 500; }
  th.group-bat { background: #2a5298; }
  th.group-bowl { background: #1a6b3a; }
  th.group-field { background: #7b3a2a; }
  tbody tr:nth-child(even) { background: #f7f7f7; }
  tbody tr:hover { background: #eef4ff; }
  td { padding: 2px 3px; }
  td input {
    width: 100%; padding: 3px 5px; border: 1px solid transparent; border-radius: 2px;
    font-size: 11px; background: transparent;
  }
  td input:focus { border-color: #4a90d9; background: #fff; outline: none; }
  td input[type=number] { -moz-appearance: textfield; }
  td input[type=number]::-webkit-inner-spin-button,
  td input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  td input.changed { border-color: #e67e22 !important; background: #fffaf5 !important; }
  td.name-col input { font-weight: 600; }
  .btn-del {
    background: none; border: none; cursor: pointer; color: #c0392b;
    font-size: 14px; line-height: 1; padding: 0 4px;
  }
  .btn-add {
    margin-top: 8px; padding: 4px 10px; background: #1e3a5f; color: #fff;
    border: none; border-radius: 3px; cursor: pointer; font-size: 11px;
  }

  /* ── team name bar ── */
  .team-name-row { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .team-name-row input { flex: 1; padding: 5px 9px; border: 1px solid #ccc; border-radius: 4px; font-size: 13px; font-weight: 600; }
  .btn-del-team { padding: 4px 10px; background: #c0392b; color: #fff; border: none; border-radius: 3px; cursor: pointer; font-size: 11px; }

  .divider { height: 1px; background: #e0e0e0; margin: 10px 0; }
  .sub-label { font-size: 11px; font-weight: 700; color: #888; text-transform: uppercase; letter-spacing: .5px; margin: 8px 0 4px; }

  #noData { color: #999; text-align: center; padding: 60px 20px; font-size: 14px; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>Tony Webb — Statistics Review Editor</h1>
  <span id="statusMsg">Load a JSON file to begin</span>
  <button id="btnLoad">📂 Load JSON</button>
  <button id="btnSave" disabled>💾 Save JSON</button>
</div>

<div id="layout">
  <div id="imagePane">
    <div id="imageControls">
      <span>Page:</span>
      <input type="number" id="pageNumInput" min="1" max="247" value="1">
      <button onclick="loadImage()">Go</button>
      <span id="imgStatus" style="margin-left:4px;"></span>
    </div>
    <div id="imgWrapper">
      <div id="imgPlaceholder">Load a JSON file to see the archive image</div>
      <img id="pageImg" style="display:none" alt="Archive page">
    </div>
  </div>

  <div id="editorPane">
    <div id="noData">Load a JSON file to start editing</div>
    <div id="editorContent" style="display:none"></div>
  </div>
</div>

<script>
const BASE_URL = "https://archive.acscricket.com/research/tw/tw_newspaper_cuttings_1895/files/assets/common/page-html5-substrates/page{PAGE}_5.jpg";

let data = null;
let originalJSON = "";
let currentFileName = "data.json";

// ── file loading ──────────────────────────────────────────────────────────────

let fileHandle = null;
const hasFSA = "showOpenFilePicker" in window;

document.getElementById("btnLoad").addEventListener("click", () => {
  if (hasFSA) {
    openViaFSA();
  } else {
    openViaInput();
  }
});

async function openViaFSA() {
  try {
    [fileHandle] = await window.showOpenFilePicker({
      types: [{ description: "JSON", accept: { "application/json": [".json"] } }],
      multiple: false,
    });
    const file = await fileHandle.getFile();
    await loadFile(file);
  } catch(err) {
    if (err.name !== "AbortError") alert("Could not open file: " + err.message);
  }
}

function openViaInput() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = ".json,application/json";
  input.onchange = async () => {
    const file = input.files?.[0];
    if (file) await loadFile(file);
  };
  input.click();
}

async function loadFile(file) {
  const text = await file.text();
  try {
    data = JSON.parse(text);
    originalJSON = text;
    currentFileName = file.name;
    fileHandle = null; // FSA handle not available in fallback mode
    status(`Loaded: ${file.name}`);
    document.getElementById("btnSave").disabled = false;
    renderEditor();
    const firstPage = data.teams?.[0]?.page;
    if (firstPage) {
      document.getElementById("pageNumInput").value = firstPage;
      loadImage();
    }
  } catch(err) {
    alert("Invalid JSON: " + err.message);
  }
}

document.getElementById("btnSave").addEventListener("click", saveJSON);

function status(msg) {
  document.getElementById("statusMsg").textContent = msg;
}

// ── image ─────────────────────────────────────────────────────────────────────

function loadImage() {
  const page = parseInt(document.getElementById("pageNumInput").value, 10);
  if (isNaN(page)) return;
  const padded = String(page).padStart(4, "0");
  const url = BASE_URL.replace("{PAGE}", padded);
  const img = document.getElementById("pageImg");
  const ph  = document.getElementById("imgPlaceholder");
  document.getElementById("imgStatus").textContent = "Loading…";
  img.style.display = "none";
  ph.style.display = "flex";
  ph.textContent = "Loading image…";
  img.onload = () => {
    img.style.display = "block";
    ph.style.display = "none";
    document.getElementById("imgStatus").textContent = `Page ${page}`;
  };
  img.onerror = () => {
    ph.textContent = `Could not load page ${page}`;
    document.getElementById("imgStatus").textContent = "";
  };
  img.src = url;
}

// ── render ────────────────────────────────────────────────────────────────────

function renderEditor() {
  document.getElementById("noData").style.display = "none";
  const content = document.getElementById("editorContent");
  content.style.display = "block";
  content.innerHTML = "";

  // Metadata
  content.appendChild(buildMetaSection());

  // Teams
  (data.teams || []).forEach((team, ti) => {
    content.appendChild(buildTeamSection(team, ti));
  });

  // Add team button
  const addBtn = document.createElement("button");
  addBtn.className = "btn-add";
  addBtn.textContent = "+ Add Team";
  addBtn.style.width = "100%";
  addBtn.onclick = () => {
    data.teams.push({ name: "New Team", season: "1895", page: 0, players: [] });
    renderEditor();
  };
  content.appendChild(addBtn);
}

function buildMetaSection() {
  const meta = data.metadata || {};
  const sec = makeSection("Metadata", null, true);
  const grid = div("field-grid");
  grid.appendChild(makeField("Collection", meta.collection, v => data.metadata.collection = v));
  grid.appendChild(makeField("Season", meta.season, v => data.metadata.season = v));
  grid.appendChild(makeField("Model", meta.model, v => data.metadata.model = v));
  sec.querySelector(".section-body").appendChild(grid);
  return sec;
}

function buildTeamSection(team, ti) {
  const sec = makeSection(team.name, `${(team.players||[]).length} players`);

  const body = sec.querySelector(".section-body");

  // Team name + delete button
  const nameRow = div("team-name-row");
  const nameInput = el("input", { type: "text", value: team.name, placeholder: "Team name" });
  nameInput.oninput = () => {
    team.name = nameInput.value;
    sec.querySelector("h2").textContent = nameInput.value;
    markChanged(nameInput);
  };
  const delBtn = el("button", { className: "btn-del-team", textContent: "Remove Team" });
  delBtn.onclick = () => {
    data.teams.splice(ti, 1);
    renderEditor();
  };
  nameRow.appendChild(nameInput);
  nameRow.appendChild(delBtn);
  body.appendChild(nameRow);

  // Page reference
  const pageRow = div("field-grid");
  pageRow.appendChild(makeField("Page", team.page, v => { team.page = intOrNull(v); }, "number"));
  pageRow.appendChild(makeField("Season", team.season, v => team.season = v));
  body.appendChild(pageRow);

  // Matches
  body.appendChild(divider());
  body.appendChild(subLabel("Season Summary"));
  const m = team.matches || {};
  const matchGrid = div("field-grid");
  ["played","won","drawn","lost"].forEach(k => {
    matchGrid.appendChild(makeField(k, m[k] ?? "", v => {
      if (!team.matches) team.matches = {};
      team.matches[k] = intOrNull(v);
    }, "number"));
  });
  body.appendChild(matchGrid);

  // Runs scored
  body.appendChild(divider());
  body.appendChild(subLabel("Aggregate Runs"));
  const rs = team.runs_scored || {};
  const runsGrid = div("field-grid");
  ["for","against"].forEach(side => {
    const s = (rs[side] || {});
    runsGrid.appendChild(makeField(`${side} — Runs`, s.runs ?? "", v => {
      if (!team.runs_scored) team.runs_scored = {};
      if (!team.runs_scored[side]) team.runs_scored[side] = {};
      team.runs_scored[side].runs = intOrNull(v);
    }, "number"));
    runsGrid.appendChild(makeField(`${side} — Wkts`, s.wickets ?? "", v => {
      if (!team.runs_scored) team.runs_scored = {};
      if (!team.runs_scored[side]) team.runs_scored[side] = {};
      team.runs_scored[side].wickets = intOrNull(v);
    }, "number"));
    runsGrid.appendChild(makeField(`${side} — Avg/Wkt`, s.average_per_wicket ?? "", v => {
      if (!team.runs_scored) team.runs_scored = {};
      if (!team.runs_scored[side]) team.runs_scored[side] = {};
      team.runs_scored[side].average_per_wicket = floatOrNull(v);
    }, "number"));
  });
  body.appendChild(runsGrid);

  // Players
  body.appendChild(divider());
  body.appendChild(subLabel(`Players (${(team.players||[]).length})`));
  body.appendChild(buildPlayersTable(team));

  return sec;
}

function buildPlayersTable(team) {
  const wrap = div("player-table-wrap");
  const tbl = document.createElement("table");

  // Header
  const colWidths = [130, 22, 38, 38, 52, 44, 64, 50, 44, 52, 46, 64];
  const colgroup = document.createElement("colgroup");
  colWidths.forEach(w => {
    const col = document.createElement("col");
    col.style.width = w + "px";
    colgroup.appendChild(col);
  });
  tbl.appendChild(colgroup);
  tbl.style.minWidth = colWidths.reduce((a, b) => a + b, 0) + "px";

  const thead = document.createElement("thead");
  const hr1 = document.createElement("tr");
  const hr2 = document.createElement("tr");
  const headers = [
    { label: "", colspan: 2, cls: "" },
    { label: "Batting", colspan: 5, cls: "group-bat" },
    { label: "Bowling", colspan: 6, cls: "group-bowl" },
  ];
  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = h.label;
    th.colSpan = h.colspan;
    th.className = h.cls;
    hr1.appendChild(th);
  });
  const colLabels = ["Name","","Inn","NO","Runs","HS","Avg","Ovs","Mdn","Runs","Wkts","Avg"];
  const colClasses = ["","","group-bat","group-bat","group-bat","group-bat","group-bat","group-bowl","group-bowl","group-bowl","group-bowl","group-bowl"];
  colLabels.forEach((l, i) => {
    const th = document.createElement("th");
    th.textContent = l;
    th.className = colClasses[i];
    hr2.appendChild(th);
  });
  thead.appendChild(hr1);
  thead.appendChild(hr2);
  tbl.appendChild(thead);

  const tbody = document.createElement("tbody");
  tbl.appendChild(tbody);
  wrap.appendChild(tbl);

  function renderRows() {
    tbody.innerHTML = "";
    (team.players || []).forEach((p, pi) => {
      const tr = document.createElement("tr");
      const bat = p.batting || {};
      const bowl = p.bowling || {};

      // name
      tr.appendChild(tdInput(p.name, v => { p.name = v; }, "name-col"));
      // delete
      const tdDel = document.createElement("td");
      const delBtn = el("button", { className: "btn-del", textContent: "×" });
      delBtn.title = "Remove player";
      delBtn.onclick = () => {
        team.players.splice(pi, 1);
        renderRows();
        const badge = tbl.closest(".section")?.querySelector(".badge");
        if (badge) badge.textContent = `${team.players.length} players`;
      };
      tdDel.appendChild(delBtn);
      tr.appendChild(tdDel);

      // batting
      tr.appendChild(tdInput(bat.innings, v => bat.innings = intOrNull(v), "", "number"));
      tr.appendChild(tdInput(bat.not_outs, v => bat.not_outs = intOrNull(v), "", "number"));
      tr.appendChild(tdInput(bat.runs, v => bat.runs = intOrNull(v), "", "number"));
      tr.appendChild(tdInput(bat.highest_score, v => bat.highest_score = v || null));
      tr.appendChild(tdInput(bat.average, v => bat.average = floatOrNull(v), "", "number"));

      // bowling
      tr.appendChild(tdInput(bowl.overs, v => bowl.overs = floatOrNull(v), "", "number"));
      tr.appendChild(tdInput(bowl.maidens, v => bowl.maidens = intOrNull(v), "", "number"));
      tr.appendChild(tdInput(bowl.runs, v => bowl.runs = intOrNull(v), "", "number"));
      tr.appendChild(tdInput(bowl.wickets, v => bowl.wickets = intOrNull(v), "", "number"));
      tr.appendChild(tdInput(bowl.average, v => bowl.average = floatOrNull(v), "", "number"));

      tbody.appendChild(tr);
    });
  }
  renderRows();

  const addBtn = el("button", { className: "btn-add", textContent: "+ Add Player" });
  addBtn.onclick = () => {
    team.players.push({ name: "", batting: {}, bowling: {}, fielding: {} });
    renderRows();
    const badge = tbl.closest(".section")?.querySelector(".badge");
    if (badge) badge.textContent = `${team.players.length} players`;
  };
  wrap.appendChild(addBtn);
  return wrap;
}

// ── save ──────────────────────────────────────────────────────────────────────

async function saveJSON() {
  if (data.metadata) {
    data.metadata.total_teams = (data.teams || []).length;
    data.metadata.total_players = (data.teams || []).reduce((s, t) => s + (t.players||[]).length, 0);
  }
  const json = JSON.stringify(data, null, 2);
  try {
    if (fileHandle && "createWritable" in fileHandle) {
      const writable = await fileHandle.createWritable();
      await writable.write(json);
      await writable.close();
      status("Saved ✓");
    } else {
      const blob = new Blob([json], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = currentFileName.replace(/\.json$/i, "") + ".json";
      document.body.appendChild(a);
      a.click();
      a.remove();
      URL.revokeObjectURL(url);
      status("Downloaded " + a.download);
    }
  } catch(err) {
    alert("Could not write file: " + err.message);
  }
}

// ── helpers ───────────────────────────────────────────────────────────────────

function makeSection(title, badge, startCollapsed = false) {
  const sec = document.createElement("div");
  sec.className = "section" + (startCollapsed ? " collapsed" : "");
  const header = div("section-header");
  const h2 = document.createElement("h2");
  h2.textContent = title;
  header.appendChild(h2);
  if (badge) {
    const b = el("span", { className: "badge", textContent: badge });
    header.appendChild(b);
  }
  header.onclick = () => sec.classList.toggle("collapsed");
  const body = div("section-body");
  sec.appendChild(header);
  sec.appendChild(body);
  return sec;
}

function makeField(label, value, onChange, type = "text") {
  const wrap = div("field");
  const lbl = document.createElement("label");
  lbl.textContent = label;
  const inp = document.createElement("input");
  inp.type = type;
  inp.value = value ?? "";
  inp.oninput = () => { onChange(inp.value); markChanged(inp); };
  wrap.appendChild(lbl);
  wrap.appendChild(inp);
  return wrap;
}

function tdInput(value, onChange, cls = "", type = "text") {
  const td = document.createElement("td");
  if (cls) td.className = cls;
  const inp = document.createElement("input");
  inp.type = type;
  inp.value = value ?? "";
  inp.oninput = () => { onChange(inp.value); markChanged(inp); };
  td.appendChild(inp);
  return td;
}

function markChanged(inp) { inp.classList.add("changed"); }

function div(cls) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  return d;
}

function el(tag, props = {}) {
  const e = document.createElement(tag);
  Object.assign(e, props);
  return e;
}

function divider() {
  const d = document.createElement("div");
  d.className = "divider";
  return d;
}

function subLabel(text) {
  const d = document.createElement("div");
  d.className = "sub-label";
  d.textContent = text;
  return d;
}

function intOrNull(v) {
  const n = parseInt(v, 10);
  return isNaN(n) ? null : n;
}

function floatOrNull(v) {
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}
</script>
</body>
</html>
